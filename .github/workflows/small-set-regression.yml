name: Small-set reconstruction regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: small-set-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  three-photo-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 Pillow==11.0.0

      - name: Generate deterministic perspective fixtures
        run: python tests/generate-fixtures.py "${{ runner.temp }}/pocketscan-fixtures"

      - name: Run three-photo reconstruction regression
        run: node tests/three-photos.mjs "${{ runner.temp }}/pocketscan-fixtures"
